name: Make recovery check executable
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-executable.yaml]
permissions:
  contents: write
jobs:
  fix-permission:
    if: github.actor == 'ace-593'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit executable bit for the check script
        run: |
          chmod +x scripts/check.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make recovery check executable'
          git push
